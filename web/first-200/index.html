<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The First 200 | Choner</title>
<meta name="description" content="Choner helps you stay consistent with the healthy habits you want to build. We're bringing together the first 200 people ready to stop starting over.">
<meta property="og:title" content="The First 200 | Choner">
<meta property="og:description" content="We're bringing together the first 200 people ready to stop starting over.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap">
<style>
  /* ============ design tokens, copied from the real Choner app ============ */
  :root{
    --paper:#FDFCFB; --card:#FFFFFF; --ink:#1C2B33; --pmuted:#7C8C96; --dim:#D8D2CC; --pline:#EFEDEA;
    --g1:#FD8302; --g2:#FD5B01; --navy:#001827; --green:#2E9E6B; --red:#C0392B;
    --shadow-soft:0 2px 10px rgba(28,43,51,.06);
    --shadow-card:0 8px 24px rgba(28,43,51,.07);
    --shadow-btn:0 10px 26px rgba(253,91,1,.32);
    --shadow-float:0 10px 24px rgba(0,24,39,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Poppins',-apple-system,system-ui,sans-serif;
    min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--g2);outline-offset:2px;}
  img{max-width:100%;}

  .shell{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ============ floating stepbar (the app's onboarding pattern) ============ */
  .stepbar{
    background:var(--navy);display:flex;justify-content:space-between;align-items:center;flex:none;
    padding:16px 20px;margin:16px 16px 0;border-radius:24px;box-shadow:var(--shadow-float);
  }
  .back{background:none;border:none;color:#fff;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;padding:0;}
  .back:disabled{opacity:.3;cursor:default;}
  .back svg{width:20px;height:20px;}
  .dots{display:flex;gap:6px;align-items:center;}
  .dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.3);display:block;}
  .dots i.on{width:22px;background:linear-gradient(135deg,var(--g1),var(--g2));}
  .dots i.done{background:rgba(255,255,255,.7);}

  .content{flex:1;padding:26px 22px 24px;display:flex;flex-direction:column;}
  .steplbl{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--pmuted);margin-bottom:8px;}
  .p-h1{font-size:25px;font-weight:300;letter-spacing:-.5px;line-height:1.28;margin-bottom:8px;text-wrap:balance;}
  .p-h1 b{font-weight:600;color:var(--g2);}
  .p-sub{font-size:13.5px;color:var(--pmuted);font-weight:300;line-height:1.55;margin-bottom:22px;}

  /* ============ fields ============ */
  .fld{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .fld label{font-size:12.5px;font-weight:500;}
  .fld label span{color:var(--pmuted);font-weight:400;}
  input.txt,select.txt{
    width:100%;background:var(--card);border:1.5px solid var(--pline);border-radius:16px;
    padding:14px 16px;font-family:inherit;font-size:16px;color:var(--ink);box-shadow:var(--shadow-soft);outline:none;
  }
  input.txt:focus,select.txt:focus{border-color:var(--g2);}
  input.txt.bad{border-color:var(--red);}
  .ferr{font-size:12px;color:var(--red);}
  select.txt{appearance:none;-webkit-appearance:none;padding-right:44px;}
  .sel-wrap{position:relative;}
  .sel-wrap::after{content:'';position:absolute;right:18px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--pmuted);border-bottom:1.6px solid var(--pmuted);transform:translateY(-70%) rotate(45deg);pointer-events:none;}

  /* a field only bots can see. see HONEYPOT below */
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}

  /* ============ choice rows ============ */
  .choice{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--pline);border-radius:18px;padding:15px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-soft);text-align:left;width:100%;font-family:inherit;color:inherit;}
  .choice.on{border-color:var(--g2);background:linear-gradient(160deg,rgba(253,131,2,.07),rgba(253,91,1,.02));}
  .choice .ic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;}
  .choice .ic svg{width:22px;height:22px;color:var(--pmuted);}
  .choice.on .ic svg{color:var(--g2);}
  .choice .t{font-size:14px;font-weight:500;}
  .choice .d{font-size:11.5px;color:var(--pmuted);margin-top:2px;}

  /* ============ pill cards ============ */
  .prow{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .pillcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--pline);border-radius:18px;padding:14px 8px;cursor:pointer;flex:1;min-width:0;font:inherit;color:var(--ink);box-shadow:var(--shadow-soft);text-align:center;}
  .pillcard.on{border-color:var(--g2);background:linear-gradient(160deg,rgba(253,131,2,.07),rgba(253,91,1,.02));color:var(--g2);font-weight:600;}
  .pillcard:disabled{opacity:.38;cursor:default;}
  .pillcard .t{font-size:13px;}
  .prow.wrap .pillcard{flex:0 1 auto;padding:11px 15px;}

  /* ============ segmented control ============ */
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--pline);border-radius:999px;padding:3px;box-shadow:var(--shadow-soft);width:100%;margin-bottom:14px;}
  .seg button{flex:1;border:none;background:none;border-radius:999px;padding:9px 10px;font-size:12.5px;font-weight:500;color:var(--pmuted);cursor:pointer;}
  .seg button.on{background:var(--navy);color:#fff;}

  .sect{font-size:11px;font-weight:600;color:var(--pmuted);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 10px;}
  .sect span{text-transform:none;font-weight:400;letter-spacing:0;}
  .hint{font-size:11.5px;color:var(--pmuted);line-height:1.5;}

  /* ============ buttons ============ */
  .btn{width:100%;border:none;border-radius:18px;padding:16px 0;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:var(--shadow-btn);cursor:pointer;transition:transform .18s ease;}
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn:disabled{opacity:.45;box-shadow:none;cursor:default;}
  .btn-g{width:100%;border:none;background:none;color:var(--pmuted);font-size:13px;font-weight:500;padding:13px 0;cursor:pointer;}
  .foot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:2px;}
  /* No footer button on the confirmation, so centre it rather than leaving a
     dead third at the bottom. */
  .content.done{justify-content:center;}
  .foot .ferr{text-align:center;padding-bottom:8px;}

  /* ============ cards ============ */
  .card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow-card);}
  .soft{background:var(--card);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow-soft);font-size:12px;color:var(--pmuted);line-height:1.5;}
  .soft b{color:var(--ink);font-weight:600;}

  /* ============ consent ============ */
  .chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0 2px;cursor:pointer;background:none;border:none;text-align:left;font:inherit;color:var(--pmuted);font-size:12px;line-height:1.5;width:100%;}
  .chklink{margin:0 0 2px 28px;}
  .chklink a{font-size:12px;font-weight:500;color:var(--g2);text-decoration:underline;}
  .chk i{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--pline);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px;background:var(--card);}
  .chk.on i{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;}
  .chk i svg{width:12px;height:12px;}
  .chk u{color:var(--ink);text-decoration:underline;}

  /* ============ welcome ============ */
  .welcome{flex:1;display:flex;flex-direction:column;padding:0 22px 14px;}
  .welcome .sp{flex:1;}
  .welcome .brand{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;}
  .wordmark{font-size:40px;font-weight:600;letter-spacing:-1.1px;color:var(--ink);}
  .wordmark span{color:var(--g1);}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
           background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;
           background-clip:text;color:transparent;}
  .welcome .tag{font-size:14.5px;color:var(--pmuted);line-height:1.6;max-width:300px;font-weight:300;}
  .welcome .tag b{color:var(--ink);font-weight:500;}
  .acts{display:flex;flex-direction:column;gap:14px;width:100%;}

  /* ============ confirmation ============ */
  .center{text-align:center;}
  .big-ok{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;margin:12px auto 18px;color:#fff;box-shadow:var(--shadow-btn);}
  .big-ok svg{width:36px;height:36px;}
  .codebox{border:1.5px dashed var(--dim);border-radius:18px;padding:18px;text-align:center;background:var(--paper);}
  .codebox .lbl{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--pmuted);margin-bottom:6px;}
  .codebox .code{font-size:27px;font-weight:700;letter-spacing:2px;
                 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
                 user-select:all;-webkit-user-select:all;}
  .summary{font-size:13px;color:var(--pmuted);line-height:1.6;text-align:center;margin-top:14px;}
  .summary b{color:var(--ink);font-weight:600;}
  .btn.row{display:flex;align-items:center;justify-content:center;gap:9px;}
  .btn.row svg{width:18px;height:18px;}
  .reass{text-align:center;font-size:11.5px;color:var(--pmuted);margin-top:10px;line-height:1.5;}
  .reass b{color:var(--ink);font-weight:600;}

  /* ============ the intro: the hourglass ============
     Replaces the dark "two signals" screen. Light paper ground now, so the
     intro and step 1 are one surface rather than a dark screen that flips.

     The glass outline and the fill maths share ONE profile (see HG_* in the
     script). Change the curve in one place or the water stops matching the
     glass. */
  .welcome{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 28px 20px;position:relative;cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .welcome .eyebrow{
    font-size:11px;letter-spacing:2.4px;margin-bottom:12px;
    opacity:0;animation:hgFadeIn .5s ease .1s forwards;
  }
  .glass-wrap{position:relative;width:150px;height:195px;opacity:0;animation:hgFadeIn .5s ease .15s forwards;}
  .glass-wrap svg{width:100%;height:100%;overflow:visible;display:block;will-change:transform;}
  .ring{
    position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
    border-radius:50%;border:2px solid rgba(253,131,2,.55);opacity:0;transform:scale(.6);pointer-events:none;
  }
  .glass-shadow{
    position:absolute;left:50%;bottom:-12px;width:130px;height:20px;transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(253,91,1,.22) 0%, transparent 70%);opacity:0;
  }
  .welcome.done .ring{animation:hgRipple 1.1s ease-out forwards;}
  .welcome.done .glass-wrap{animation:hgBeat 1s ease-in-out 0s 1, hgIdle 3.4s ease-in-out 1.3s infinite;opacity:1;}
  .welcome.done .glass-shadow{opacity:1;transition:opacity .6s ease;}
  @keyframes hgRipple{0%{opacity:.9;transform:scale(.6);}100%{opacity:0;transform:scale(2.1);}}
  @keyframes hgBeat{0%,100%{transform:scale(1);}18%{transform:scale(1.07);}34%{transform:scale(1);}50%{transform:scale(1.045);}68%{transform:scale(1);}}
  @keyframes hgIdle{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  @keyframes hgFadeIn{to{opacity:1;}}

  .wave1{animation:hgDrift 2.6s linear infinite;}
  .wave2{animation:hgDrift2 3.8s linear infinite;}
  @keyframes hgDrift{from{transform:translateX(0);}to{transform:translateX(-100px);}}
  @keyframes hgDrift2{from{transform:translateX(-100px);}to{transform:translateX(0);}}

  #stream{stroke:#FD6A0A;stroke-width:3;stroke-linecap:round;transition:opacity .5s ease;opacity:0;}
  #drop{fill:#FD8302;opacity:0;}
  .welcome.done #drop{animation:hgDrip 3.4s ease-in 1.2s infinite;}
  @keyframes hgDrip{
    0%{transform:translateY(0) scale(.6);opacity:0;}
    8%{opacity:1;transform:translateY(0) scale(1);}
    38%{opacity:1;transform:translateY(var(--d,60px));}
    40%,100%{opacity:0;transform:translateY(var(--d,60px));}
  }

  .reveal{text-align:center;margin-top:34px;width:100%;display:flex;flex-direction:column;align-items:center;}
  .welcome .wordmark{font-size:34px;letter-spacing:-1px;line-height:1.1;opacity:0;transform:translateY(10px);}
  .welcome .ask{
    font-size:19px;font-weight:600;line-height:1.3;letter-spacing:-.2px;max-width:300px;
    margin-top:14px;text-wrap:balance;opacity:0;transform:translateY(10px);
  }
  .ask b{font-weight:700;background:linear-gradient(135deg,var(--g1),var(--g2));
         -webkit-background-clip:text;background-clip:text;color:transparent;}
  .welcome .tag{font-size:13px;line-height:1.6;max-width:290px;font-weight:300;margin-top:10px;opacity:0;transform:translateY(10px);}
  /* The closer is the brief's orange semibold, not a dimmed line: it is the
     ask, and it was reading as a footnote. */
  .welcome .tag.quiet{font-size:13.5px;color:var(--g2);font-weight:600;line-height:1.45;}
  .welcome .acts{margin-top:20px;max-width:290px;opacity:0;transform:translateY(10px);}

  .welcome.done .wordmark{animation:hgRise .5s ease 0s forwards;}
  .welcome.done .ask{animation:hgRise .5s ease .14s forwards;}
  .welcome.done .tag{animation:hgRise .5s ease .28s forwards;}
  .welcome.done .tag.quiet{animation:hgRise .5s ease .40s forwards;}
  .welcome.done .acts{animation:hgRise .5s ease .52s forwards;}
  .welcome.instant .wordmark,.welcome.instant .ask,.welcome.instant .tag,
  .welcome.instant .tag.quiet,.welcome.instant .acts{animation-duration:.01s;animation-delay:0s;}
  .welcome.instant #drop{animation-delay:.4s;}
  .welcome.instant .ring{display:none;}
  @keyframes hgRise{to{opacity:1;transform:translateY(0);}}

  /* The hint only ever appears after the intro. iOS never sees it: the motion
     prompt rides on the Count Me In tap instead, which is the only gesture
     Safari will accept it from. */
  .tilt-hint{
    position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);white-space:nowrap;
    border:none;background:none;font-family:inherit;font-size:11px;font-weight:500;
    letter-spacing:.3px;color:var(--pmuted);opacity:0;pointer-events:none;
    transition:opacity .6s ease;padding:4px 8px;
  }
  .tilt-hint.show{opacity:.85;}
  .glass-wrap.tiltable{touch-action:none;cursor:grab;}

  @media (prefers-reduced-motion: reduce){
    .wave1,.wave2{animation:none;}
    .welcome.done #drop{animation:none;}
    .welcome.done .glass-wrap{animation:none;}
    .welcome.done .ring{display:none;}
  }

  @media (min-width:600px){
    body{padding-top:40px;padding-bottom:40px;}
    .shell{min-height:auto;border-radius:28px;box-shadow:0 30px 60px rgba(0,10,20,.12);overflow:hidden;background:var(--paper);}
  }
</style>
</head>
<body>

<div class="shell" id="app"></div>

<script>
/* =========================================================
   CHONER | The First 200

   Tokens, fonts and component classes are copied from the real
   Choner app so the two look like one product.

   Every vocabulary list below is the APP'S list, not an
   approximation: activity_key values, the 70 location slugs,
   the five time-of-day slots, the nine exercises and the quiz
   enums all match what the database will accept. Changing one
   here without changing it in the app breaks the join.

   See docs/FIRST_200_BUILD_SPEC.md.
========================================================== */

/* ---------- the one thing to set before deploying ---------- */
const ENDPOINT = 'https://bkncpybneoqjnkhhchxg.supabase.co/functions/v1/register-first-200';

/* Where the page lives, for the referral link. Fixed rather than read from
   location: on a file:// or data: URL origin is the string "null", and at
   .../join/index.html the filename would ride along in every shared link. */
const SHARE_BASE = 'https://join.choner.io/';

const ic = (n, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const IC = {
  back:'<path d="M15 5l-7 7 7 7"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  run:'<circle cx="14.5" cy="4.5" r="1.6" fill="currentColor" stroke="none"/><path d="M10 21l1.6-5.4L9 14l1.2-4.4c.3-1 1.1-1.6 2-1.5l3 .4 2.6 2.6M14.5 9.1l-1.6 4 2.4 1.8L14.5 19"/>',
  sleep:'<path d="M20 14.5A8 8 0 119.5 4a6.3 6.3 0 1010.5 10.5z"/>',
  leaf:'<path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14zM5 19l8-8"/>',
  bolt:'<path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke-linejoin="round"/>',
  redo:'<path d="M4 9a8 8 0 0114-4.9M20 15a8 8 0 01-14 4.9"/><path d="M18 3v5h-5M6 21v-5h5"/>',
  community:'<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="8" r="2.6"/><path d="M2.5 19c0-3.3 2.9-5.6 6.5-5.6s6.5 2.3 6.5 5.6"/><path d="M17 13.4c2.6 0 4.5 1.9 4.5 4.4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  cloud:'<path d="M7 15a4 4 0 01.6-7.9A5 5 0 0117 9a3 3 0 010 6H7zM9 18l-1 2M13 18l-1 2M17 18l-1 2"/>',
  together:'<circle cx="8" cy="8" r="2.6"/><circle cx="16" cy="8" r="2.6"/><path d="M4 20c0-3.3 2-5.6 4-5.6M20 20c0-3.3-2-5.6-4-5.6"/><path d="M9.5 12.5l2.5 2 2.5-2"/>',
  separate:'<rect x="3" y="6" width="7" height="12" rx="1.5"/><rect x="14" y="6" width="7" height="12" rx="1.5"/>',
  walk:'<circle cx="13" cy="4.5" r="1.6"/><path d="M11 21l1.5-6-2.5-2 1-5 3 1 2 3M8 12l-1 3M15 11l3 2"/>',
  bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1.5-3H6M15 9l-2 7"/>',
  dumb:'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/>',
  share:'<path d="M12 15V3M12 3L8 7M12 3l4 4"/><path d="M5 12v7a1 1 0 001 1h12a1 1 0 001-1v-7"/>',
};

/* ---------- the quiz, from features/onboarding/constants.ts ---------- */
const GOALS = [
  ['move_more','Move more','Build an active routine','run'],
  ['sleep_better','Sleep better','Rest and recover well','sleep'],
  ['reduce_stress','Reduce stress','Feel calmer day to day','leaf'],
  ['improve_energy','Improve energy','Stay sharp and focused','bolt'],
];
const STRUGGLES = [
  ['start_but_stop','I start but stop','Good intentions, hard to stay consistent','redo'],
  ['lack_accountability','I lack accountability','No one keeping me on track','community'],
  ['too_busy',"I'm too busy",'Life gets in the way every time','clock'],
  ['overwhelmed','I feel overwhelmed',"Don't even know where to begin",'cloud'],
];
const AGES = [['18-24','18 to 24'],['25-34','25 to 34'],['35-44','35 to 44'],['45-54','45 to 54'],['55+','55+']];
const GENDERS = [['male','Male'],['female','Female'],['prefer_not_to_say','Prefer not to say']];

/* mode: user_challenges.mode, plus 'either' for the pool preference. */
/* Order matters: the two definite answers first, the compromise last. "Either
   works" sitting in the middle read as the safe middle option and invited
   people to pick it by default, which is the one answer that tells matching
   least. */
const MODES = [
  ['together','Together','Meet up in person for sessions','together'],
  ['separate','Separately, together','Same commitment, your own place','separate'],
  ['either','Either works','Open to either, whatever fits that day','community'],
];

/* The SIX ACTIVE templates, in the app's sort_order. Keys are activity_key,
   which is what matching reads. Note Workouts stores 'home_workouts'.
   Badminton is NOT here: its template exists but is_active = false. */
const ACTIVITIES = [
  ['running','Running','run'],
  ['jogging','Jogging','run'],
  ['walking','Walking','walk'],
  ['cycling','Cycling','bike'],
  ['yoga','Yoga','leaf'],
  ['home_workouts','Workouts','dumb'],
];

/* features/challenges/exercises.ts. Free text, stored as written. */
const EXERCISES = ['Push-ups','Squats','Lunges','Sit-ups','Pull-ups','Plank','Burpees','Jumping jacks','Stretching routine'];
const MAX_EXERCISES = 4;

/* matching.ts SLOT_ORDER. Multi-select here: the app stores one slot and
   blocks an in-person pair whose slots differ, but someone free in the

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()); }

/* Lenient: 07X XXX XXXX, +947..., 947... all arrive. A number we cannot parse
   is kept as typed rather than dropped: a human will read it. */
function normalisePhone(v){
  const d = String(v||'').replace(/[^0-9+]/g,'');
  if (!d) return null;
  if (d.charAt(0) === '+') return d;
  if (d.charAt(0) === '0')  return '+94' + d.slice(1);
  if (d.slice(0,2) === '94') return '+' + d;
  return d;
}

function go(id){
  // iOS Safari only shows its motion prompt from inside a user gesture, and
  // this is the one the intro has. Fired before anything else so no await can
  // get between the tap and the prompt. Declining cannot block the signup:
  // requestMotion resolves false and we carry on.
  if (S.cur === 'welcome' && window.hourglass) { try { window.hourglass.requestMotion(); } catch (e) {} }
  S.cur = id; S.submitErr = null; render(); window.scrollTo(0,0);
}

/* ---------- shared pieces ---------- */
function stepbar(dotId){
  const idx = DOTS.indexOf(dotId);
  const d = DOTS.map((id,i) => `<i class="${i===idx?'on':i<idx?'done':''}"></i>`).join('');
  const canBack = ORDER.indexOf(S.cur) > 1;
  return `<div class="stepbar"><button class="back" ${canBack?'':'disabled'} data-back="1" aria-label="Back">${ic('back',2.2)}</button><div class="dots">${d}</div><div style="width:32px"></div></div>`;
}
const btn = (label, opts={}) => `<button class="btn" ${opts.go?`data-go="${opts.go}"`:''} ${opts.act?`data-act="${opts.act}"`:''} ${opts.dis?'disabled':''}>${label}</button>`;
const ttl = (n, a, b, sub) => `<div class="steplbl">Step ${n} of ${DOTS.length}</div><div class="p-h1">${a}<b>${b}</b></div><div class="p-sub">${sub}</div>`;
const rows = (list, field, sel) => list.map(o =>
  `<button class="choice ${sel===o[0]?'on':''}" data-act="pick" data-field="${field}" data-v="${o[0]}">
     <div class="ic">${ic(o[3],1.8)}</div><div><div class="t">${o[1]}</div><div class="d">${o[2]}</div></div>
   </button>`).join('');
const pills = (list, field, sel) => list.map(o =>
  `<button class="pillcard ${sel===o[0]?'on':''}" data-act="pick" data-field="${field}" data-v="${o[0]}"><div class="t">${o[1]}</div></button>`).join('');

function screenLocation(){
  const opt = ([v,l]) => `<option value="${v}" ${S.location===v?'selected':''}>${esc(l)}</option>`;
  const opts = S.locArea === 'colombo'
    ? `<optgroup label="Colombo City">${COLOMBO_CITY.map(opt).join('')}</optgroup>
       <optgroup label="Greater Colombo">${GREATER_COLOMBO.map(opt).join('')}</optgroup>`
    : SL_DISTRICTS.map(opt).join('');

  /* mode is step 4, so the answer is already known. 'separate' and 'either'
     have no geographic constraint at all, so telling those people they are "on
     file" would be both discouraging and untrue. */
  const note = S.locArea !== 'other' ? '' : `<div class="soft">${
    S.mode === 'together'
      ? "In-person sessions start in the Colombo area. You can still be matched now if you're open to <b>Separately, together</b>: same commitment, your own place."

  return `${stepbar('location')}<div class="content">
    ${ttl(6,'Where are ','you based?','Together sessions need somewhere to meet. Separately, together works anywhere.')}
    <div class="seg">
      <button class="${S.locArea==='colombo'?'on':''}" data-act="locarea" data-v="colombo">Colombo area</button>

function screenConfirm(){

  return `<div class="content done">
    <div class="center">
      <div class="big-ok">${ic('check',2.6)}</div>

         cannot reliably change that, so the copy stops promising "your inbox"

         copy; the email is the backup, not the other way round. -->
    <div class="reass">Sign up with <b>${esc(S.f.email)}</b> and we'll know you already.

    <div class="summary"><b>${esc(labelOf(ACTIVITIES,S.activity))}</b> &middot; ${esc(how)}${where?' &middot; '+esc(where):''}${when?' &middot; '+esc(when):''}</div>

    <div class="card" style="margin-top:22px;">
      <!-- One button. "Copy link instead" was removed: both the iOS and the
           Android share sheet already contain a Copy action, and on desktop
           navigator.share is absent so Share falls through to copying anyway,
           which made the two buttons literally identical there. The fall-
           through now reports itself on this button instead. -->
      <button class="btn row" id="shareBtn" data-act="share">${ic('share',2)}<span id="shareLbl">Invite a friend</span></button>
      <!-- The URL is not printed. Truncated in a box it looked broken, and
           nobody types a 48-character token by hand anyway. -->
      <input class="hp" type="text" readonly value="${esc(refUrl)}" id="refInput" tabindex="-1" aria-hidden="true">
      <div class="reass">This is literally the whole idea. Someone showing up with you.</div>
    </div>
  </div>`;
}

/* ---------- the hourglass ----------------------------------------------
   Lifted from the prototype, with one structural change: this page rebuilds
   #app's innerHTML on every step, so element references and animation frames
   CANNOT be captured once at load. mount() re-captures after each render of
   the intro; unmount() cancels the frame and drops the sensor listener, or
   the loop keeps running (and draining battery) on every screen after it. */
const HG = (() => {
  const FILL = 0.60;                                   // bottom bulb ends 60% full by height, top 40%
  const Y_TOP = 22, Y_NECK = 130, Y_BOT = 238, CXC = 100;
  const TOP_R = [[144,22],[144,62],[105,92],[105,130]];
  const BOT_R = [[105,130],[105,168],[144,198],[144,238]];
  const RAD = Math.PI / 180;
  const bez = (P,t) => { const u = 1-t; return [
    u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0],
    u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1] ]; };
  const mir = x => 2*CXC - x;
  const glassD =
    'M' + mir(144) + ' ' + Y_TOP + ' H144 C' + TOP_R[1].join(' ') + ' ' + TOP_R[2].join(' ') + ' ' + TOP_R[3].join(' ') +
    ' C' + BOT_R[1].join(' ') + ' ' + BOT_R[2].join(' ') + ' ' + BOT_R[3].join(' ') + ' H' + mir(144) +
    ' C' + mir(BOT_R[2][0]) + ' ' + BOT_R[2][1] + ' ' + mir(BOT_R[1][0]) + ' ' + BOT_R[1][1] + ' ' + mir(BOT_R[0][0]) + ' ' + BOT_R[0][1] +
    ' C' + mir(TOP_R[2][0]) + ' ' + TOP_R[2][1] + ' ' + mir(TOP_R[1][0]) + ' ' + TOP_R[1][1] + ' ' + mir(TOP_R[0][0]) + ' ' + TOP_R[0][1] + ' Z';

  // Half-width by y, sampled once. The glass outline and the fill maths read
  // the same profile, so they cannot drift apart.
  const STEP = .25, N = Math.round((Y_BOT - Y_TOP) / STEP) + 1, HW = new Float64Array(N);
  (function build(){
    const pts = [];
    for (const P of [TOP_R, BOT_R]) for (let i=0;i<=400;i++){ const pt = bez(P,i/400); pts.push([pt[1], pt[0]-CXC]); }
    pts.sort((a,b) => a[0]-b[0]);
    let k = 0;
    for (let i=0;i<N;i++){
      const y = Y_TOP + i*STEP;
      while (k < pts.length-2 && pts[k+1][0] < y) k++;
      const y0 = pts[k][0], w0 = pts[k][1], y1 = pts[k+1][0], w1 = pts[k+1][1];
      const t = y1===y0 ? 0 : (y-y0)/(y1-y0);
      HW[i] = w0 + (w1-w0)*Math.max(0,Math.min(1,t));
    }
  })();
  const idx = y => Math.round((y - Y_TOP) / STEP);
  function areaBetween(ya, yb){ let a=0; for (let i=idx(ya); i<idx(yb); i++) a += (HW[i]+HW[i+1]) * STEP; return a; }
  const H = Y_NECK - Y_TOP;

  // Each bulb is a sealed container: a fixed volume settling on its gravity-low
  // side, which is what keeps the water level with the real world as it turns.
  function pileArea(ya, yb, dx, dy, c){
    let a = 0;
    for (let i = idx(ya); i < idx(yb); i++){
      const y = Y_TOP + i*STEP + STEP/2, hw = (HW[i] + HW[i+1]) / 2, base = (y - Y_NECK) * dy;
      let len;
      if (Math.abs(dx) < 1e-6) len = base >= c ? 2*hw : 0;
      else { const xb = (c - base) / dx;
             len = dx > 0 ? Math.max(0, hw - Math.max(xb, -hw)) : Math.max(0, Math.min(xb, hw) + hw); }
      a += Math.min(2*hw, len) * STEP;
    }
    return a;
  }
  function pileC(ya, yb, V, dx, dy){
    let lo = 1e9, hi = -1e9;
    for (let i = idx(ya); i <= idx(yb); i++){
      const y = Y_TOP + i*STEP, base = (y - Y_NECK) * dy;
      const xs = [-HW[i], HW[i]];
      for (const x of xs){ const sv = x*dx + base; if (sv < lo) lo = sv; if (sv > hi) hi = sv; }
    }
    if (V <= 0.5) return hi + 4;
    if (V >= pileArea(ya, yb, dx, dy, lo - 1) - 0.5) return lo - 4;
    let a = lo, b = hi;
    for (let n = 0; n < 26; n++){ const m = (a + b) / 2; if (pileArea(ya, yb, dx, dy, m) > V) a = m; else b = m; }
    return (a + b) / 2;
  }
  const volsAt = f => [areaBetween(Y_NECK - (1 - f) * H, Y_NECK), areaBetween(Y_BOT - f * H, Y_BOT)];
  const VTB = volsAt(FILL), VT = VTB[0], VB = VTB[1], TOT = VT + VB;

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ease = p => 1 - Math.pow(1 - p, 3);
  const DUR = 1600, START_DELAY = 250;

  let el = null, raf = 0, tiltRaf = 0, t0 = 0, finished = false, tiltOn = false, mounted = false;
  let tVol = 0, bVol = 0, th = 0, w = 0, tiltLast = 0;
  let sensorDeg = 0, sensorRaw = null, dragAng = 0, dragTarget = 0, dragging = false;
  let flipped = false, moved = false, sensorOn = false;
  let dragA0 = 0, dragBase = 0;

  function draw(dx, dy, streamOn){
    if (!el) return;
    const deg = Math.atan2(dx, dy) / RAD;
    const ct = pileC(Y_TOP, Y_NECK, tVol, dx, dy), cb = pileC(Y_NECK, Y_BOT, bVol, dx, dy);
    el.rotTop.setAttribute('transform', 'translate(100 ' + Y_NECK + ') rotate(' + (-deg) + ')');
    el.rotBot.setAttribute('transform', 'translate(100 ' + Y_NECK + ') rotate(' + (-deg) + ')');
    el.liqTop.setAttribute('transform', 'translate(0 ' + ct + ')');
    el.liqBot.setAttribute('transform', 'translate(0 ' + cb + ')');
    const cl = dy >= 0 ? cb : ct, len = Math.max(0, cl);
    el.stream.setAttribute('x1', 100 - dx*6); el.stream.setAttribute('y1', Y_NECK - dy*6);
    el.stream.setAttribute('x2', 100 + dx*len); el.stream.setAttribute('y2', Y_NECK + dy*len);
    el.stream.style.opacity = streamOn ? 1 : 0;
    const upright = Math.abs(deg) < 2 && dy > 0;
    el.drop.style.visibility = upright ? 'visible' : 'hidden';
    if (upright) el.drop.style.setProperty('--d', Math.max(8, cb - 12) + 'px');
  }
  function renderIntro(p, running){ const v = volsAt(FILL * p); tVol = v[0]; bVol = v[1]; draw(0, 1, running && p > 0 && p < 1); }

  function finish(instant){
    if (finished || !el) return;
    finished = true;
    cancelAnimationFrame(raf); raf = 0;
    renderIntro(1, false);
    if (instant) el.stage.classList.add('instant');
    el.stage.classList.add('done');
    setTimeout(enableTilt, instant ? 300 : 1400);
  }
  function tick(now){
    if (!el) return;
    const p = Math.min(1, Math.max(0, (now - t0 - START_DELAY) / DUR));
    renderIntro(ease(p), true);
    if (p < 1) raf = requestAnimationFrame(tick); else finish(false);
  }

  /* ---- tilt: a bonus AFTER the intro, never part of it ---- */
  function kick(){ if (tiltOn && !tiltRaf){ tiltLast = performance.now(); tiltRaf = requestAnimationFrame(tiltFrame); } }
  function tiltFrame(now){
    tiltRaf = 0;
    if (!el) return;
    const dt = Math.min(.05, (now - tiltLast) / 1000); tiltLast = now;
    if (!dragging) dragAng += (dragTarget - dragAng) * Math.min(1, dt * 8);
    const thT = sensorDeg + dragAng;
    w += (90 * (thT - th) - 9.5 * w) * dt; th += w * dt;      // under-damped on purpose: a little slosh
    const c = Math.cos(th * RAD);
    if (c < -.35) flipped = true; else if (c > .35) flipped = false;
    const target = flipped ? VB : VT, diff = target - tVol, rate = Math.abs(VB - VT) / 1.8;
    tVol += Math.sign(diff) * Math.min(Math.abs(diff), rate * dt); bVol = TOT - tVol;
    el.svg.style.transform = dragAng ? 'rotate(' + dragAng + 'deg)' : '';
    draw(Math.sin(th * RAD), c, Math.abs(diff) > .5);
    const settled = Math.abs(thT - th) < .05 && Math.abs(w) < .05 && Math.abs(diff) <= .5
                 && !dragging && Math.abs(dragAng - dragTarget) < .05;
    if (!settled) tiltRaf = requestAnimationFrame(tiltFrame);
  }
  function onOrient(e){
    if (!el || e.beta == null || e.gamma == null) return;
    const b = e.beta * RAD, g = e.gamma * RAD;
    const ux = -Math.cos(b) * Math.sin(g), uy = Math.sin(b);
    const a = ((screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation || 0)) * RAD;
    const mx = -ux, my = -uy;
    const sx = mx * Math.cos(a) - my * Math.sin(a), sy = mx * Math.sin(a) + my * Math.cos(a);
    const dx = sx, dy = -sy;
    const m = Math.hypot(dx, dy), k = Math.min(1, Math.max(0, (m - .2) / .3));   // lying flat: ignore
    const raw = Math.atan2(dx * k, dy * k + (1 - k)) / RAD;
    if (sensorRaw == null) sensorDeg = raw;
    else { let df = raw - sensorRaw; if (df > 180) df -= 360; if (df < -180) df += 360; sensorDeg += df; }
    sensorRaw = raw;
    if (Math.abs(sensorDeg) > 8 && !moved){ moved = true; setTimeout(() => { if (el) el.hint.classList.remove('show'); }, 1800); }
    kick();
  }
  function startSensor(){ if (!sensorOn){ sensorOn = true; window.addEventListener('deviceorientation', onOrient); } }

  /* Must be called SYNCHRONOUSLY inside a tap, before any await: iOS Safari
     only shows its motion prompt from a user gesture. No-op elsewhere, safe to
     call repeatedly, and declining must never block the signup. */
  function requestMotion(){
    if (reduce || !('DeviceOrientationEvent' in window)) return Promise.resolve(false);
    if (typeof DeviceOrientationEvent.requestPermission !== 'function'){ startSensor(); return Promise.resolve(true); }
    try {
      return DeviceOrientationEvent.requestPermission()
        .then(r => { if (r === 'granted'){ startSensor(); return true; } return false; })
        .catch(() => false);
    } catch (e) { return Promise.resolve(false); }
  }

  function enableTilt(){
    if (tiltOn || reduce || !finished || !el) return;
    tiltOn = true;
    el.wrap.classList.add('tiltable');
    const coarse = matchMedia('(pointer: coarse)').matches, hasSensor = 'DeviceOrientationEvent' in window;
    const needsAsk = hasSensor && typeof DeviceOrientationEvent.requestPermission === 'function';
    if (hasSensor && !needsAsk) startSensor();
    // No "tap here" button. On iOS the prompt rides on Count Me In instead, so
    // there is nothing useful to say until they have tapped it.
    if (coarse && hasSensor){
      if (!needsAsk){ el.hint.textContent = 'Tilt your phone'; setTimeout(() => { if (el) el.hint.classList.remove('show'); }, 5000); }
    } else if (!coarse) el.hint.textContent = 'Drag to turn the hourglass';
    if (el.hint.textContent) requestAnimationFrame(() => { if (el) el.hint.classList.add('show'); });
    kick();
  }

  const angleAt = e => { const r = el.wrap.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2)) / RAD; };
  const onDown = e => { if (!tiltOn || !el) return;
    dragging = true; dragA0 = angleAt(e); dragBase = dragAng;
    el.wrap.setPointerCapture(e.pointerId); el.hint.classList.remove('show'); kick(); e.stopPropagation(); };
  const onMove = e => { if (!dragging || !el) return;
    let d = angleAt(e) - dragA0; if (d > 180) d -= 360; if (d < -180) d += 360;
    dragAng = dragBase + d; dragTarget = dragAng; kick(); };
  const endDrag = () => { if (!dragging) return; dragging = false; dragTarget = Math.round(dragAng / 180) * 180; kick(); };
  // Tap anywhere to skip, except on a real control: the CTA and the hint must
  // still do their own job on the first tap rather than only skipping.
  const onStageClick = e => { if (!finished && !e.target.closest('[data-go],[data-act],.tilt-hint')) finish(true); };

  function unmount(){
    if (!mounted) return;
    mounted = false;
    cancelAnimationFrame(raf); cancelAnimationFrame(tiltRaf); raf = tiltRaf = 0;
    window.removeEventListener('deviceorientation', onOrient); sensorOn = false;
    el = null;
  }

  function mount(){
    unmount();
    const stage = document.getElementById('introStage');
    if (!stage) return;
    const wrap = document.getElementById('glassWrap');
    el = { stage: stage, wrap: wrap, svg: wrap.querySelector('svg'), hint: document.getElementById('tiltHint'),
           rotTop: document.getElementById('rotTop'), liqTop: document.getElementById('liqTop'),
           rotBot: document.getElementById('rotBot'), liqBot: document.getElementById('liqBot'),
           stream: document.getElementById('stream'), drop: document.getElementById('drop') };
    ['glassClipPath','glassFill','glassStroke'].forEach(id => document.getElementById(id).setAttribute('d', glassD));
    mounted = true;
    finished = false; tiltOn = false; moved = false; dragging = false;
    th = 0; w = 0; sensorDeg = 0; dragAng = 0; dragTarget = 0; sensorRaw = null; flipped = false;
    stage.addEventListener('click', onStageClick);
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);
    renderIntro(0, false);
    if (reduce){ finish(true); return; }
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }

  return { mount: mount, unmount: unmount, requestMotion: requestMotion };
})();
window.hourglass = HG;

/* ---------- render ---------- */
const SCREENS = {
  welcome:screenWelcome, t1:screenT1, goal:screenGoal, struggle:screenStruggle, agegender:screenAgeGender,
  mode:screenMode, location:screenLocation, activity:screenActivity, confirm:screenConfirm,
};
function render(){
  // This assignment throws the intro's DOM away, so the hourglass has to let go
  // of its element references and its animation frame BEFORE it happens, and
  // take fresh ones after. Without the unmount the loop keeps running on every
  // later screen, against nodes that no longer exist.
  HG.unmount();
  document.getElementById('app').innerHTML = (SCREENS[S.cur] || screenWelcome)();
  if (S.cur === 'welcome') HG.mount();
}

/* ---------- the server ---------- */
async function submitRecord(){
  const res = await fetch(ENDPOINT, {
    method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({
      full_name:S.f.name.trim(),
      email:S.f.email.trim().toLowerCase(),
      phone:normalisePhone(S.f.phone),
      primary_goal:S.goal,
      main_struggle:S.struggle,
      age_range:S.age,
      gender:S.gender,
      mode:S.mode,
      times_of_day:S.times,
      location: S.locArea==='colombo' ? S.location : null,
      district: S.locArea==='other'   ? S.location : null,
      activity_key:S.activity,
      exercises: S.activity==='home_workouts' ? S.exercises : [],
      consent_contact:S.consentContact,
      // Records that they reached the step carrying the matching notice, which
      // only a completed form does. Not a consent: matching is the service
      // they came for, so it runs on that basis, not on a tickbox.
      consent_match:!!S.activity,
      ref:S.ref,
      source:S.src,
      website:(document.getElementById('f-website')||{}).value || '',
    }),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || !j.ok) throw new Error(j.error === 'invalid_email'
    ? "That email doesn't look right."
    : "We couldn't save that. Check your connection and try again.");
  S.accessCode = j.access_code;
  S.claimToken = j.claim_token;
}

// The share button is the only button now, so the copied-confirmation has to
// land on it. Without this the desktop path (no share sheet, falls through to
// copying) would do its work in total silence and read as a dead button.
function copyLink(){
  const inp = document.getElementById('refInput');
  const lbl = document.getElementById('shareLbl');
  try {
    if (navigator.clipboard) navigator.clipboard.writeText(inp.value);
    else { inp.select(); inp.setSelectionRange(0, 9999); document.execCommand('copy'); }
  } catch (e) { /* nothing useful to tell them; the sheet or a long-press still works */ }
  if (!lbl) return;
  lbl.textContent = 'Link copied';
  setTimeout(() => { const l = document.getElementById('shareLbl'); if (l) l.textContent = 'Invite a friend'; }, 1800);
}

/* ---------- actions ---------- */
async function act(name, v, field){
  switch(name){
    case 'pick': S[field] = v; break;

    case 'pick-activity':
      S.activity = v;
      // Leaving Workouts must not strand exercises on a run.
      if (v !== 'home_workouts') S.exercises = [];
      break;

    case 'ex': {
      const i = S.exercises.indexOf(v);
      if (i >= 0) S.exercises.splice(i, 1);
      else if (S.exercises.length < MAX_EXERCISES) S.exercises.push(v);
      break;
    }

    case 'time': {
      const i = S.times.indexOf(v);
      if (i >= 0) S.times.splice(i, 1); else S.times.push(v);
      break;
    }

    case 'locarea': S.locArea = v; S.location = null; break;

    case 'consent': S.consentContact = !S.consentContact; break;

    // Save as soon as we have a name and an email. Someone who abandons at
    // step 5 is otherwise lost completely, and that is the most expensive
    // loss there is, because the outreach to get them here is already spent.
    // Fire and forget: a save must never block the step.
    case 'next-t1':
      submitRecord().catch(() => {});
      go('goal');
      return;

    case 'next-goal':      go('struggle'); return;
    case 'next-struggle':  go('agegender'); return;
    case 'next-agegender': go('mode'); return;
    case 'next-mode':      go('location'); return;
    case 'next-location':  go('activity'); return;

    // The one place that must NOT navigate optimistically: a confirmation
    // screen after a failed save tells someone they are on a list they are
    // not on.
    case 'finish':
      S.busy = true; S.submitErr = null; render();
      try { await submitRecord(); go('confirm'); }
      catch (e) { S.busy = false; S.submitErr = e.message; render(); }
      return;

    // The OS share sheet: WhatsApp, Messages, email, and whatever else the
    // phone has, with no list for us to guess at and keep up to date. Needs
    // https and a real tap, which this is. Desktop Chrome, Edge and Safari
    // have it too; anything without falls through to the clipboard.
    case 'share': {
      const url = document.getElementById('refInput').value;
      // The line 200 people send to their friends, so it carries the loop.
      // Deliberately echoes the intro's question back at the reader.
      const text = 'What if you had someone to show up with?\nJoin The First 200';
      if (navigator.share) {
        try { await navigator.share({ title: 'Choner', text, url }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }  // they closed the sheet
      }
      copyLink();
      return;
    }

  }
  render();
}

/* ---------- events ---------- */
const app = document.getElementById('app');

// Typing re-renders only when the Continue button's state would actually
// change. Re-rendering on every keystroke steals the caret on some Android
// keyboards, and restoring it is worse than not moving it.
app.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'f-name')  S.f.name  = e.target.value;
  else if (id === 'f-email'){ S.f.email = e.target.value; S.err.email = null; }
  else if (id === 'f-phone') S.f.phone = e.target.value;
  else return;

  const cont = app.querySelector('.foot .btn');
  if (!cont) return;
  const shouldEnable = S.f.name.trim().length > 1 && validEmail(S.f.email);
  if (cont.disabled === shouldEnable) cont.disabled = !shouldEnable;
});

app.addEventListener('change', e => {
  if (e.target.id === 'f-loc'){ S.location = e.target.value; render(); }
});

app.addEventListener('blur', e => {
  if (e.target.id === 'f-email' && e.target.value && !validEmail(e.target.value)){
    S.err.email = "That doesn't look like a valid email."; render();
  }
}, true);

app.addEventListener('click', e => {
  const back = e.target.closest('[data-back]');
  if (back){ const i = ORDER.indexOf(S.cur); if (i > 1) go(ORDER[i-1]); return; }
  const t = e.target.closest('[data-go],[data-act]');
  if (!t || t.disabled) return;
  if (t.dataset.act){ act(t.dataset.act, t.dataset.v, t.dataset.field); return; }
  go(t.dataset.go);
});

render();
</script>
</body>
